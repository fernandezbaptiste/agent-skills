name: Skill Review & Optimize
on:
  pull_request:
    paths: ['**/SKILL.md']

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: tesslio/skill-review-and-optimize@1944678616ac6fb1f6f6961cf7b6a5e70fb243d9
        with:
          optimize: 'true'
          tessl-token: ${{ secrets.TESSL_API_TOKEN }}
