name: Skill Review & Optimize
on:
  pull_request:
    paths: ['**/SKILL.md']

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: tesslio/skill-review-and-optimize@62e7f435de224693cce4c48bcc5f1d337bf4bbf7
        with:
          optimize: 'true'
          tessl-token: ${{ secrets.TESSL_API_TOKEN }}
